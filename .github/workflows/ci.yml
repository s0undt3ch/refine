name: CI Workflow
run-name: "CI (${{ github.event_name == 'pull_request' && format('pr: #{0}', github.event.number) || format('branch: {0}', github.ref_name) }})"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # A new push to a PR cancels that PR's older runs. Runs on main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  COLUMNS: 190
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise & virtualenv
        uses: ./.github/actions/setup-virtualenv
        with:
          cache-prefix: pre-commit

      - name: Run Pre-commit
        run: |
          prek run --show-diff-on-failure --color=always --all-files

  tests:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    needs:
      - pre-commit

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        # PRs test every Python on Linux but only the oldest and newest on Windows and macOS.
        exclude: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            {"os": "windows-latest", "python-version": "3.12"},
            {"os": "windows-latest", "python-version": "3.13"},
            {"os": "windows-latest", "python-version": "3.14"},
            {"os": "macos-latest", "python-version": "3.12"},
            {"os": "macos-latest", "python-version": "3.13"},
            {"os": "macos-latest", "python-version": "3.14"}
          ]' || '[]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise & virtualenv
        uses: ./.github/actions/setup-virtualenv
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: tests

      - name: Run Tests
        run: |
          uv run coverage run -m pytest --color=yes

      - name: Report Coverage
        run: |
          uv run coverage combine
          uv run coverage report

  docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - pre-commit
      - tests

    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise & virtualenv
        uses: ./.github/actions/setup-virtualenv
        with:
          cache-prefix: docs
          uv-sync-args: --group docs

      - name: Build MkDocs site
        run: uv run mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
