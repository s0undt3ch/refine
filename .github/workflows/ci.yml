name: CI Workflow
run-name: "CI (${{ github.event_name == 'pull_request' && format('pr: #{0}', github.event.number) || format('branch: {0}', github.ref_name) }})"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # A new push to a PR cancels that PR's older runs. Runs on main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  COLUMNS: 190
  FORCE_COLOR: "1"

jobs:
  prepare-ci:
    name: Prepare CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      test-matrix: ${{ steps.generate-build-matrix.outputs.test-matrix }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ToolR
        uses: s0undt3ch/ToolR@90681fa0fbfa1bbe0e3fe93424beee3fa25e828e # v0.37.0

      - name: Generate Build Matrix
        id: generate-build-matrix
        run: toolr ci generate-build-matrix

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise & virtualenv
        uses: ./.github/actions/setup-virtualenv
        with:
          cache-prefix: pre-commit

      - name: Run Pre-commit
        run: |
          prek run --show-diff-on-failure --color=always --all-files

  tests:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    needs:
      - prepare-ci
      - pre-commit

    strategy:
      fail-fast: false
      # Built by `toolr ci generate-build-matrix` (tools/ci.py).
      matrix:
        include: ${{ fromJSON(needs.prepare-ci.outputs.test-matrix) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise & virtualenv
        uses: ./.github/actions/setup-virtualenv
        with:
          python-version: ${{ matrix.python-version }}
          cache-prefix: tests

      - name: Run Tests
        run: |
          uv run coverage run -m pytest --color=yes

      - name: Report Coverage
        run: |
          uv run coverage combine
          uv run coverage report

  docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - pre-commit
      - tests

    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise & virtualenv
        uses: ./.github/actions/setup-virtualenv
        with:
          cache-prefix: docs
          uv-sync-args: --group docs

      - name: Build MkDocs site
        run: uv run mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
