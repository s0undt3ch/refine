name: Setup Virtualenv
description: >-
  Install the repo tooling via mise (Python, uv, ruff, jactionlint, prek, ...)
  and sync the project virtualenv. Tool versions come solely from mise.toml, so
  there is a single source of truth and nothing to drift.

inputs:
  python-version:
    default: ""
    description: >-
      Python version to use. Overrides the version pinned in mise.toml via
      MISE_PYTHON_VERSION. Leave empty (the default) to inherit mise.toml's
      pin; pass a concrete version (e.g. "3.12") from a matrix entry.
  cache-prefix:
    required: true
    description: "Prefix mixed into the mise / .venv cache keys (e.g. tests, docs)."
  cache-seed:
    default: "1"
    description: "Bumpable seed mixed into every cache key. Bump to invalidate all caches."
  uv-sync-args:
    default: "--all-extras --dev"
    description: "Arguments passed to `uv sync` (e.g. `--group docs`)."
  mise-version:
    required: true
    description: >-
      Version of mise to install via jdx/mise-action. Callers pass the
      `MISE_VERSION` from `.github/env`, so every job uses the same pinned mise
      build and shares the matching mise-install cache.

runs:
  using: composite
  steps:
    # Export MISE_PYTHON_VERSION to $GITHUB_ENV *before* `Set up mise` runs, so
    # the override applies to every subsequent step (uv sync, tests, ...) and
    # not only the mise-action step. Without this, mise re-resolves to
    # mise.toml's `python = ...` pin in later steps and the venv ends up on the
    # wrong CPython.
    - name: Export MISE_PYTHON_VERSION
      id: python-pin
      if: inputs.python-version != ''
      shell: bash
      env:
        INPUTS_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        # Anything written to $GITHUB_ENV can inject variables, so accept only
        # the version shapes the tools/ci.py matrix produces.
        if [[ ! "${INPUTS_PYTHON_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?t?$ ]]; then
          echo "::error::invalid python-version input: ${INPUTS_PYTHON_VERSION}" >&2
          exit 1
        fi
        echo "MISE_PYTHON_VERSION=${INPUTS_PYTHON_VERSION}" >> "$GITHUB_ENV"
        echo "version=${INPUTS_PYTHON_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Set up mise
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      env:
        # Belt-and-braces: also pass via the step env so the override takes
        # effect even when the previous step is skipped (empty python-version).
        MISE_PYTHON_VERSION: ${{ steps.python-pin.outputs.version }}
      with:
        version: ${{ inputs.mise-version }}
        cache: true
        cache_key_prefix: mise|${{ inputs.cache-seed }}|${{ inputs.mise-version }}|${{ runner.os }}|${{ runner.arch }}|${{ inputs.cache-prefix }}

    # The .venv links to the interpreter that built it, so key its cache on the
    # exact Python and uv builds, not just the requested minor version.
    - name: Get Python version checksum
      id: python-version-checksum
      shell: bash
      run: echo "version-sha256sum=$(python --version --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Get uv version checksum
      id: uv-version-checksum
      shell: bash
      run: echo "version-sha256sum=$(uv --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Set up .venv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: >-
          venv|${{ inputs.cache-seed }}|${{ inputs.mise-version }}|${{ runner.os }}|${{ runner.arch }}|${{ inputs.cache-prefix }}|${{ steps.python-version-checksum.outputs.version-sha256sum }}|${{ steps.uv-version-checksum.outputs.version-sha256sum }}|${{ hashFiles('mise.toml', 'uv.lock', 'pyproject.toml') }}

    - name: Install Python dependencies
      shell: bash
      env:
        UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
      # Split the args string into separate uv flags without glob expansion.
      run: |
        read -ra args <<< "$UV_SYNC_ARGS"
        uv sync "${args[@]}"
